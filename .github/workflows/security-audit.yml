name: paper-validation

on:
  workflow_dispatch:
  push:
    branches:
      - ko-50k-direct-check
  schedule:
    - cron: '*/5 * * * *'

permissions: {}

concurrency:
  group: paper-validation-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore PAPER state cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .paper_state
          key: paper-state-v5-${{ github.run_id }}
          restore-keys: |
            paper-state-v5-

      - name: Fetch exact public commit without credentials
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --max-time 30 --max-filesize 20000000 \
            "https://github.com/${REPOSITORY}/archive/${COMMIT_SHA}.tar.gz" \
            -o repo.tar.gz
          mkdir repo
          tar -xzf repo.tar.gz --strip-components=1 -C repo
          cd repo
          python3 security_guard.py .
          python3 -m unittest discover -q

      - name: Run one-time cross-market historical PAPER research
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .paper_state
          if [ ! -s .paper_state/cross_market_public_v1.json ]; then
            tmp="$(mktemp)"
            python3 repo/cross_market_public_run.py | tee "$tmp"
            mv "$tmp" .paper_state/cross_market_public_v1.json
          else
            echo "CROSS_MARKET_RESULT_REUSED"
          fi

      - name: Run one-time KO-style upper-bound research
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .paper_state
          if [ ! -s .paper_state/ko_upper_bound_50k_v1.json ]; then
            tmp="$(mktemp)"
            python3 repo/ko_upper_bound_run.py | tee "$tmp"
            mv "$tmp" .paper_state/ko_upper_bound_50k_v1.json
          else
            echo "KO_UPPER_BOUND_50K_RESULT_REUSED"
          fi

      - name: Run GBPJPY KO 50k cost sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python3 repo/gbpjpy_ko_50k_cost_check.py | tee gbpjpy-ko-50k-cost.json

      - name: Resolve two-hour campaign window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .paper_state
          python3 repo/campaign_window.py \
            --state .paper_state/window_v5.json \
            --hours 2 \
            --github-output "$GITHUB_OUTPUT" \
            | tee campaign-window-summary.json

      - name: Collect near-real-time public ticks
        if: steps.window.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .paper_state
          python3 repo/fast_paper_sampler.py \
            --output .paper_state/fast_ticks.jsonl \
            --interval 10 \
            --duration 210 \
            | tee fast-sampler-summary.json

      - name: Replay ticks through fast PAPER strategies
        if: steps.window.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 repo/fast_paper_engine.py \
            --samples .paper_state/fast_ticks.jsonl \
            --state .paper_state/fast_engine_v5.json \
            --window .paper_state/window_v5.json \
            | tee fast-engine-summary.json

      - name: Run or finalize five-minute PAPER strategies
        if: steps.window.outputs.active == 'true' || steps.window.outputs.status == 'ENDED'
        shell: bash
        run: |
          set -euo pipefail
          python3 repo/live_paper_cycle.py \
            --state .paper_state/state_v5.json \
            --window .paper_state/window_v5.json \
            | tee paper-summary.json

      - name: Write run summary
        shell: bash
        run: |
          {
            echo '## PAPER validation summary'
            echo
            echo '### Campaign window'
            echo '~~~json'
            cat campaign-window-summary.json
            echo '~~~'
            echo
            echo '### Fast sampler'
            echo '~~~json'
            if [ -f fast-sampler-summary.json ]; then cat fast-sampler-summary.json; else echo '{"status":"SKIPPED_AFTER_END"}'; fi
            echo '~~~'
            echo
            echo '### Fast strategies'
            echo '~~~json'
            if [ -f fast-engine-summary.json ]; then cat fast-engine-summary.json; else echo '{"status":"SKIPPED_AFTER_END"}'; fi
            echo '~~~'
            echo
            echo '### Five-minute strategies'
            echo '~~~json'
            if [ -f paper-summary.json ]; then cat paper-summary.json; else echo '{"status":"SKIPPED_AFTER_END"}'; fi
            echo '~~~'
            echo
            echo '### Cross-market 7-day research'
            echo '~~~json'
            if [ -f .paper_state/cross_market_public_v1.json ]; then cat .paper_state/cross_market_public_v1.json; else echo '{"status":"NOT_YET_AVAILABLE"}'; fi
            echo '~~~'
            echo
            echo '### KO-style upper-bound research'
            echo '~~~json'
            if [ -f .paper_state/ko_upper_bound_50k_v1.json ]; then cat .paper_state/ko_upper_bound_50k_v1.json; else echo '{"status":"NOT_YET_AVAILABLE"}'; fi
            echo '~~~'
            echo
            echo '### GBPJPY KO 50k cost sensitivity'
            echo '~~~json'
            if [ -f gbpjpy-ko-50k-cost.json ]; then cat gbpjpy-ko-50k-cost.json; else echo '{"status":"NOT_AVAILABLE"}'; fi
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
