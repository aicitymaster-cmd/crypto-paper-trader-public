name: paper-validation

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions: {}

concurrency:
  group: paper-validation-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore PAPER state cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .paper_state
          key: paper-state-v2-${{ github.run_id }}
          restore-keys: |
            paper-state-v2-

      - name: Fetch exact public commit without credentials
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --max-time 30 --max-filesize 20000000 \
            "https://github.com/${REPOSITORY}/archive/${COMMIT_SHA}.tar.gz" \
            -o repo.tar.gz
          mkdir repo
          tar -xzf repo.tar.gz --strip-components=1 -C repo
          cd repo
          python3 security_guard.py .
          python3 -m unittest discover -q

      - name: Collect near-real-time public ticks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .paper_state
          python3 repo/fast_paper_sampler.py \
            --output .paper_state/fast_ticks.jsonl \
            --interval 10 \
            --duration 210 \
            | tee fast-sampler-summary.json

      - name: Replay ticks through fast PAPER strategies
        shell: bash
        run: |
          set -euo pipefail
          python3 repo/fast_paper_engine.py \
            --samples .paper_state/fast_ticks.jsonl \
            --state .paper_state/fast_engine_v2.json \
            | tee fast-engine-summary.json

      - name: Run five-minute PAPER strategies
        shell: bash
        run: |
          set -euo pipefail
          python3 repo/live_paper_cycle.py \
            --state .paper_state/state_v2.json \
            --campaign-start 2026-09-25T09:30:00Z \
            --campaign-end 2026-10-02T09:30:00Z \
            | tee paper-summary.json

      - name: Write run summary
        shell: bash
        run: |
          {
            echo '## PAPER validation summary'
            echo
            echo '### Fast sampler'
            echo '~~~json'
            cat fast-sampler-summary.json
            echo '~~~'
            echo
            echo '### Fast strategies'
            echo '~~~json'
            cat fast-engine-summary.json
            echo '~~~'
            echo
            echo '### Five-minute strategies'
            echo '~~~json'
            cat paper-summary.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
