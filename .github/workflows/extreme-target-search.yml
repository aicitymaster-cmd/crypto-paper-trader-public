name: Extreme target search

on:
  workflow_dispatch:
  push:
    branches:
      - seven-day-cross-asset-final
    paths:
      - extreme_target_search.py
      - .github/workflows/extreme-target-search.yml

permissions: {}

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --max-time 30 --max-filesize 20000000 \
            "https://github.com/${REPOSITORY}/archive/${COMMIT_SHA}.tar.gz" -o repo.tar.gz
          mkdir repo
          tar -xzf repo.tar.gz --strip-components=1 -C repo
      - name: Run broad search
        shell: bash
        run: python3 repo/extreme_target_search.py
