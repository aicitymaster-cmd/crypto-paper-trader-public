name: QQQ real option backtest
on:
  workflow_dispatch:
  push:
    branches: [seven-day-cross-asset-final]
    paths:
      - qqq_real_option_backtest.py
      - .github/workflows/qqq-real-option-backtest.yml
permissions: {}
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 30 --max-filesize 20000000 "https://github.com/${REPOSITORY}/archive/${COMMIT_SHA}.tar.gz" -o repo.tar.gz
          mkdir repo
          tar -xzf repo.tar.gz --strip-components=1 -C repo
      - name: Install parquet dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --quiet pandas pyarrow
      - name: Run QQQ real-option backtest
        shell: bash
        run: python3 repo/qqq_real_option_backtest.py
