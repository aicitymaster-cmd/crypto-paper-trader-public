name: variable-risk-research

on:
  workflow_dispatch:
  push:
    branches:
      - mini-option-variable-risk
    paths:
      - long_horizon_gold_validation.py
      - gold_filter_holdout.py
      - four_block_gold_stability.py
      - staged_profit_lock_research.py
      - test_staged_profit_lock_research.py
      - test_four_block_gold_stability.py
      - test_gold_filter_holdout.py
      - conditional_gold_research.py
      - test_conditional_gold_research.py
      - test_long_horizon_gold_validation.py
      - .github/workflows/variable-risk-research.yml

permissions: {}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch exact public commit without credentials
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --max-time 30 --max-filesize 20000000 \
            "https://github.com/${REPOSITORY}/archive/${COMMIT_SHA}.tar.gz" \
            -o repo.tar.gz
          mkdir repo
          tar -xzf repo.tar.gz --strip-components=1 -C repo
          cd repo
          python3 security_guard.py .
          python3 -m unittest discover -q

      - name: Run staged profit-lock research
        shell: bash
        run: |
          set -euo pipefail
          python3 repo/staged_profit_lock_research.py

      - name: Run four-block GOLD stability
        shell: bash
        run: |
          set -euo pipefail
          python3 repo/four_block_gold_stability.py

      - name: Run frozen GOLD filter holdout
        shell: bash
        run: |
          set -euo pipefail
          python3 repo/gold_filter_holdout.py

      - name: Run conditional GOLD filter research
        shell: bash
        run: |
          set -euo pipefail
          python3 repo/conditional_gold_research.py

      - name: Run long-horizon GOLD validation
        shell: bash
        run: |
          set -euo pipefail
          python3 repo/long_horizon_gold_validation.py
