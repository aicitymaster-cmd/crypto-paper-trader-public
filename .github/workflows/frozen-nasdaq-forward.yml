name: Frozen NASDAQ forward paper check

on:
  workflow_dispatch:
  schedule:
    - cron: "10 * * * 1-5"
  push:
    branches:
      - seven-day-cross-asset-final
    paths:
      - frozen_nasdaq_forward.py
      - .github/workflows/frozen-nasdaq-forward.yml

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --max-time 30 --max-filesize 20000000 \
            "https://github.com/${REPOSITORY}/archive/${COMMIT_SHA}.tar.gz" -o repo.tar.gz
          mkdir repo
          tar -xzf repo.tar.gz --strip-components=1 -C repo
      - name: Run frozen paper signal
        shell: bash
        run: python3 repo/frozen_nasdaq_forward.py
