name: SPY IWM real option backtest
on:
  workflow_dispatch:
  push:
    branches: [seven-day-cross-asset-final]
    paths:
      - real_option_eod_compare.py
      - .github/workflows/spy-iwm-real-option-backtest.yml
permissions: {}
jobs:
  backtest:
    strategy:
      matrix:
        asset: [iwm, spy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASSET: ${{ matrix.asset }}
    steps:
      - name: Checkout exact commit
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 30 --max-filesize 20000000 "https://github.com/${REPOSITORY}/archive/${COMMIT_SHA}.tar.gz" -o repo.tar.gz
          mkdir repo
          tar -xzf repo.tar.gz --strip-components=1 -C repo
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet pandas pyarrow duckdb
      - name: Run real-option backtest
        run: python3 repo/real_option_eod_compare.py
